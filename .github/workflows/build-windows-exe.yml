name: Build Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "streamlit==1.60.0" "pyinstaller==6.21.0"

      - name: Check Python source files
        shell: pwsh
        run: |
          python -m py_compile app.py data_utils.py launcher.py

      - name: Build Windows package (slim)
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name "GeneratorCatalogFilter" `
            --collect-all streamlit `
            --collect-submodules pyarrow `
            --collect-data pyarrow `
            --add-data "app.py;." `
            --exclude-module matplotlib `
            --exclude-module tkinter `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide2 `
            --exclude-module PySide6 `
            --exclude-module IPython `
            --exclude-module jupyter `
            --exclude-module notebook `
            --exclude-module pytest `
            --exclude-module pyarrow.tests `
            --exclude-module pandas.tests `
            launcher.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GeneratorCatalogFilter\GeneratorCatalogFilter.exe")) {
            throw "GeneratorCatalogFilter.exe was not created."
          }
          $size = (Get-ChildItem -Recurse "dist\GeneratorCatalogFilter" | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Unzipped package size: {0:N1} MB" -f $size)

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path "Output\GeneratorCatalogFilter-Setup.exe")) {
            throw "Installer was not created."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GeneratorCatalogFilter-Setup
          path: Output/GeneratorCatalogFilter-Setup.exe
          retention-days: 30
          if-no-files-found: error
