name: Build Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "streamlit==1.60.0" "pyinstaller==6.21.0"

      - name: Check Python source files
        shell: pwsh
        run: |
          python -m py_compile app.py data_utils.py launcher.py

      - name: Build Windows package
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name "GeneratorCatalogFilter" `
            --collect-all streamlit `
            --collect-all pyarrow `
            --add-data "app.py;." `
            launcher.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GeneratorCatalogFilter\GeneratorCatalogFilter.exe")) {
            throw "GeneratorCatalogFilter.exe was not created."
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GeneratorCatalogFilter-Windows
          path: dist/GeneratorCatalogFilter/
          retention-days: 30
          if-no-files-found: error
